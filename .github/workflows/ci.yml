name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/leopard?schema=public
      RATE_LIMIT_HMAC_SECRET: ci-only-not-a-secret-value-000000000000000000000
      PRIVACY_NOTICE_APPROVED: "false"
      NEXT_PUBLIC_SITE_URL: https://leopard.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
