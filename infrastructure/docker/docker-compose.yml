services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leopard
      POSTGRES_USER: leopard_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leopard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leopard_app -d leopard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leopard_postgres_data:
